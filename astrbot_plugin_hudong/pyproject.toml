[project]
name = "astrbot_plugin_hudong"
version = "1.0.0"
description = "互动 —— 新一代群聊互动 AstrBot 插件"
requires-python = ">=3.10"
authors = [{ name = "科技酱" }]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["__pycache__"]

[tool.ruff.lint]
select = ["F", "W", "E", "ASYNC", "C4", "Q", "I", "UP"]
ignore = ["F403", "F405", "E501", "ASYNC230", "ASYNC240"]
